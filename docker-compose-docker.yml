services:
  configs-service:
    image: ${ECR_REPOSITORY}/fc-configs-service:1.0.0
    container_name: configs-service
    healthcheck:
      test: [ "CMD", 'sh', '-c', 'echo -e "Checking service availability"; while ! nc -z "configs-service" 4080; do sleep 1; printf "-"; done; echo -e " >> Service has started";' ]
      timeout: 10s
      retries: 10
    ports:
      - "8888:8888"
    expose:
      - "8888"
    networks:
      - fcNet
    environment:
      TZ: ${TIMEZONE}
      OTEL_SERVICE_NAME: "configs-service"
      SPRING_PROFILES_ACTIVE: "docker"
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL}

networks:
  fcNet:
    name: fcNet
    external: true
    driver: bridge