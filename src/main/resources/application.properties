#======================================= App Configuration =======================================
spring.application.name=configs-service
spring.config.import=optional:file:.env[.properties]
server.port=8888

#======================Spring Cloud Config Server GIT Configuration======================================
spring.cloud.config.server.git.default-label=${SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL}
spring.cloud.config.server.git.uri=${SPRING_CLOUD_CONFIG_SERVER_GIT_URI}
spring.cloud.config.server.git.username=${SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME}
spring.cloud.config.server.git.password=${SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD}
spring.cloud.config.server.git.clone-on-start=${SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START}

#======================Eureka Configuration======================================
eureka.client.service-url.defaultZone=http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOSTNAME}:${EUREKA_SERVER_PORT}/eureka/
eureka.instance.secure-port-enabled=${EUREKA_INSTANCE_SECURE_PORT_ENABLED}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS}
eureka.instance.metadata-map.startup=${random.int}
eureka.client.registry-fetch-interval-seconds=${EUREKA_INSTANCE_REGISTRY_FETCH_INTERVAL_IN_SECONDS}

#Routes Discovery Automatically
spring.cloud.gateway.discovery.locator.enabled=${SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED}
spring.cloud.gateway.discovery.locator.lower-case-service-id=${SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE}

#======================Logging Configuration=======================================.
# To monitor log file on admin server
logging.file.path=${LOGGING_FILE_PATH}
logging.file.name=${LOGGING_FILE_PATH}${spring.application.name}.log
logging.logback.rollingpolicy.max-history=${LOGGING_FILE_MAX_HISTORY}
logging.logback.rollingpolicy.max-file-size=${LOGGING_FILE_MAX_SIZE:10MB}

logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator=${LOGGING_LEVEL_ROUTE_DEFINITION_LOCATOR}
logging.level.org.springframework.cloud.gateway=${LOGGING_LEVEL_SPRING_CLOUD_GATEWAY}

#======================Actuator Configuration=======================================
management.info.env.enabled=true
info.app.name=Config-Server Actuator
info.app.java.version=1.0
info.app.type=Config-Server MicroService
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always



